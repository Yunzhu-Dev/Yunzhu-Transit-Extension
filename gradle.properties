# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# ForgeGradle 会对 libraries.minecraft.net 做证书校验，国内无法直连，需跳过该校验
#systemProp.net.minecraftforge.gradle.check.certs=false
minecraftVersion=1.20.1
mtrVersion=4.0.0
#
## -------- Minecraft download mirrors (BMCLAPI) --------
## Mojang 官方源 (piston-meta/piston-data/libraries.minecraft.net) 在国内无法直连，
## 这里把 Loom 可配置的下载源切到 BMCLAPI 镜像。
#loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
#loom_libraries_base=https://bmclapi2.bangbang93.com/maven/
#loom_resources_base=https://bmclapi2.bangbang93.com/assets/
version=1.0.2-prerelease.3

# -------- Deploy for Testing --------
deploy.enableDownload=false
deploy.targetMtrVersion=4.0.4
deploy.maxThreads=16
deploy.mcVersions=1.16.5,1.17.1,1.18.2,1.19.2,1.19.4,1.20.1,1.20.4
deploy.loaders=fabric,forge
# Override default Minecraft dir (default: ~/.minecraft)
# deploy.minecraftDir=D:/Minecraft/test/.minecraft
